<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Monthly Magazines | Mining Discovery</title>
  <style>
    body {
      font-family: 'Poppins', sans-serif;
      margin: 0;
      padding: 40px;
      background-color: #fff;
      color: #1b1b1b;
    }

    h2, h3 {
      margin: 0;
      font-weight: 600;
      color: #1b1b1b;
    }

    .section-container {
      max-width: 1200px;
      margin: 0 auto;
    }

    .digital-edition {
      font-size: 24px;
      text-decoration: underline;
      margin-bottom: 10px;
    }

    .monthly-magazines {
      font-size: 28px;
      text-decoration: underline;
      margin-bottom: 40px;
    }

    .magazine-list {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 30px;
      margin-bottom: 40px;
    }

    .magazine-card {
      border: 1px solid #dcdcdc;
      border-radius: 6px;
      overflow: hidden;
      background: #fff;
      transition: transform 0.3s ease;
    }

    .magazine-card:hover {
      transform: translateY(-5px);
    }

    .magazine-card img {
      width: 100%;
      height: 320px;
      object-fit: cover;
      display: block;
    }

    .edition-label {
      text-align: center;
      font-size: 16px;
      font-weight: 500;
      padding: 12px 0;
      color: #1b1b1b;
    }

    .view-more {
      display: flex;
      justify-content: center;
    }

    .view-more button {
      background: #1b1b1b;
      color: #fff;
      padding: 10px 28px;
      border: none;
      border-radius: 25px;
      font-size: 15px;
      cursor: pointer;
      transition: background 0.3s ease;
    }

    .view-more button:hover {
      background: #3a3a3a;
    }

    @media (max-width: 768px) {
      body {
        padding: 20px;
      }
      .monthly-magazines {
        font-size: 24px;
      }
      .magazine-card img {
        height: 250px;
      }
    }
    
    .section-container {
      max-width: 1250px;
      margin: 0 auto;
    }

    .ceo-profile-list {
     display: grid
;
    grid-template-columns: repeat(auto-fit, minmax(117px, 1fr));
    gap: 25px;
    margin-bottom: 40px;
    height: 200px;
    }

    .ceo-card {
      border: 1px solid #dcdcdc;
      border-radius: 6px;
      overflow: hidden;
      background: #fff;
      transition: transform 0.3s ease;
      cursor: pointer;
    }

    .ceo-card:hover {
      transform: translateY(-5px);
    }

    .ceo-card img {
      width: 100%;
      height: 300px;
      object-fit: cover;
      display: block;
    }

    .ceo-name {
      font-size: 18px;
      font-weight: 600;
      color: #1b1b1b;
      text-align: center;
      padding: 10px 0 4px;
    }

    .ceo-title {
      font-size: 14px;
      text-align: center;
      color: #6b6b6b;
      padding-bottom: 10px;
    }

    .view-more {
      display: flex;
      justify-content: flex-end;
    }

    .view-more button {
      background: #1b1b1b;
      color: #fff;
      padding: 10px 28px;
      border: none;
      border-radius: 25px;
      font-size: 15px;
      cursor: pointer;
      transition: background 0.3s ease;
    }

    .view-more button:hover {
      background: #3a3a3a;
    }

    hr {
      border: none;
      border-bottom: 2px solid #c6a45c;
      margin-top: 40px;
    }

    @media (max-width: 768px) {
      body {
        padding: 20px;
      }
      .ceo-card img {
        height: 240px;
      }
      .ceo-name {
        font-size: 16px;
      }
    }
    .section-container {
      max-width: 1200px;
      margin: 0 auto;
    }

    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 30px;
    }

    .section-header h2 {
      font-size: 26px;
      font-weight: 600;
      text-decoration: underline;
      margin: 0;
      color: #1b1b1b;
    }

    .view-more button {
      background: #1b1b1b;
      color: #fff;
      padding: 10px 28px;
      border: none;
      border-radius: 25px;
      font-size: 15px;
      cursor: pointer;
      transition: background 0.3s ease;
    }

    .view-more button:hover {
      background: #3a3a3a;
    }

    .profile-list {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 30px;
      margin-bottom: 40px;
    }

    .profile-card {
      border: 1px solid #dcdcdc;
      border-radius: 6px;
      overflow: hidden;
      background: #fff;
      transition: transform 0.3s ease;
    }

    .profile-card:hover {
      transform: translateY(-5px);
    }

    .profile-card img {
      width: 100%;
      height: 340px;
      object-fit: cover;
      display: block;
    }

    .profile-info {
      text-align: left;
      padding: 12px;
    }

    .profile-name {
      font-size: 18px;
      font-weight: 600;
      color: #1b1b1b;
    }

    .profile-subtitle {
      font-size: 14px;
      color: #b18844;
      font-weight: 500;
      margin-top: 3px;
    }

    hr {
      border: none;
      border-bottom: 2px solid #c6a45c;
      margin-top: 40px;
    }

    @media (max-width: 768px) {
      body {
        padding: 20px;
      }
      .profile-card img {
        height: 250px;
      }
    }
  </style>
</head>
