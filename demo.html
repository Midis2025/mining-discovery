<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mining Discovery Skeleton Preloader</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; font-family: "Segoe UI", sans-serif; }

  body { background:#f4f4f4; }

  /* SKELETON ANIMATION */
  .skeleton { 
    background: #e0e0e0; 
    position: relative; 
    overflow: hidden; 
    border-radius: 4px;
  }
  .skeleton::after {
    content:'';
    display:block;
    position:absolute;
    top:0; left:-150px;
    height:100%; width:150px;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);
    animation: loading 1.5s infinite;
  }
  @keyframes loading { 0%{ left:-150px; } 100%{ left:100%; } }

  /* FULL PAGE PRELOADER */
  #skeletonPreloader {
    position:fixed;
    top:0; left:0;
    width:100%; height:100%;
    background:#f4f4f4;
    z-index:9999;
    overflow:auto;
    display:flex;
    flex-direction:column;
    gap:20px;
    padding:20px;
  }

  /* HEADER */
  .skeleton-header { padding:20px; }
  .skeleton-logo { width:180px; height:40px; margin-bottom:15px; }
  .skeleton-nav { display:flex; gap:15px; margin-bottom:15px; }
  .skeleton-nav-item { width:80px; height:20px; }

  /* HERO/BANNER */
  .skeleton-banner { width:100%; height:200px; margin-bottom:20px; border-radius:8px; }

  /* CONTAINER LAYOUT */
  .container { display:flex; gap:20px; }
  .skeleton-sidebar { width:250px; flex-shrink:0; display:flex; flex-direction:column; gap:15px; }
  .skeleton-sidebar-item {
     height:420px;
      border-radius:8px;
       box-shadow:0 4px 6px rgba(0,0,0,0.1);
       background-color: #e0e0e0;
}

  .main-content { flex:1; display:flex; flex-direction:column; gap:20px; }

  /* CARDS */
  .skeleton-cards { display:flex; flex-wrap:wrap; gap:15px; }
  .skeleton-card { flex:1 1 calc(33.333% - 10px); height:180px; border-radius:8px; }

  /* VIDEO */
  .skeleton-video { width:100%; height:180px; border-radius:8px; }

  /* MAGAZINE */
  .skeleton-magazine { width:150px; height:220px; border-radius:8px; }

  /* FOOTER */
  .skeleton-footer { padding:30px; display:flex; flex-direction:column; gap:15px; }
  .skeleton-footer-logo { width:180px; height:40px; }
  .skeleton-footer-links { display:flex; gap:10px; flex-wrap:wrap; }
  .skeleton-footer-link { width:80px; height:20px; }

  /* HIDE REAL CONTENT */
  #realContent { display:none; }
</style>
</head>
<body>

<!-- SKELETON PRELOADER -->
<div id="skeletonPreloader">

  <!-- HEADER -->
  <header class="skeleton-header">
    <div class="skeleton skeleton-logo"></div>
    <div class="skeleton-nav">
      <div class="skeleton skeleton-nav-item"></div>
      <div class="skeleton skeleton-nav-item"></div>
      <div class="skeleton skeleton-nav-item"></div>
      <div class="skeleton skeleton-nav-item"></div>
      <div class="skeleton skeleton-nav-item"></div>
    </div>
  </header>

  <!-- HERO BANNER -->
  <div class="skeleton-banner skeleton"></div>

  <!-- MAIN LAYOUT -->
  <div class="container">
    
    <!-- LEFT SIDEBAR WITH SHADOW -->
    <div class="skeleton-sidebar">
      <div class="skeleton-sidebar-item"></div>
      <div class="skeleton-sidebar-item"></div>
      <div class="skeleton-sidebar-item"></div>
    </div>

    <!-- MAIN CONTENT -->
    <div class="main-content">

      <!-- CARDS -->
      <div class="skeleton-cards">
        <div class="skeleton-card skeleton"></div>
        <div class="skeleton-card skeleton"></div>
        <div class="skeleton-card skeleton"></div>
        <div class="skeleton-card skeleton"></div>
        <div class="skeleton-card skeleton"></div>
        <div class="skeleton-card skeleton"></div>
      </div>

      <!-- VIDEOS -->
      <div class="skeleton-video skeleton"></div>
      <div class="skeleton-video skeleton"></div>

      <!-- MAGAZINE SECTION -->
      <div style="display:flex; gap:15px;">
        <div class="skeleton-magazine skeleton"></div>
        <div class="skeleton-magazine skeleton"></div>
        <div class="skeleton-magazine skeleton"></div>
      </div>

    </div>
  </div>

  <!-- FOOTER -->
  <footer class="skeleton-footer">
    <div class="skeleton-footer-logo skeleton"></div>
    <div class="skeleton-footer-links">
      <div class="skeleton-footer-link skeleton"></div>
      <div class="skeleton-footer-link skeleton"></div>
      <div class="skeleton-footer-link skeleton"></div>
      <div class="skeleton-footer-link skeleton"></div>
      <div class="skeleton-footer-link skeleton"></div>
    </div>
  </footer>

</div>

<!-- REAL PAGE CONTENT -->
<div id="realContent">
  <!-- Actual site content goes here -->
  <h1>Real Mining Discovery Site</h1>
  <p>Ab yahi content dikhega jab preloader hide ho jaye.</p>
</div>

<script>
  // SHOW REAL CONTENT AFTER PRELOADER OR TIMEOUT
  const maxTime = 10 * 60 * 1000; // 10 minutes
  const skeleton = document.getElementById('skeletonPreloader');
  const realContent = document.getElementById('realContent');

  // Auto hide after maxTime
  const timer = setTimeout(() => {
    skeleton.style.transition='opacity 0.5s';
    skeleton.style.opacity='0';
    setTimeout(() => {
      skeleton.style.display='none';
      realContent.style.display='block';
    }, 500);
  }, maxTime);

  // Optional: Click to skip preloader
  skeleton.addEventListener('click', () => {
    clearTimeout(timer);
    skeleton.style.transition='opacity 0.5s';
    skeleton.style.opacity='0';
    setTimeout(() => {
      skeleton.style.display='none';
      realContent.style.display='block';
    }, 500);
  });
</script>

</body>
</html>
