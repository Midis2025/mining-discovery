<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Subscribe Popup</title>
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #0d0d0d;
      color: #fff;
    }

    /* Overlay */
    .popup-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.75);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 999;
      padding: 15px;
      box-sizing: border-box;
      animation: fadeInBg 0.4s ease-in-out;
    }

    /* Popup Box with glassmorphism */
    .subscribe-box {
      position: relative;
      background: rgba(30, 30, 30, 0.7);
      border: 1px solid rgba(167, 124, 44, 0.4);
      backdrop-filter: blur(12px);
      border-radius: 16px;
      padding: 30px 25px;
      max-width: 420px;
      width: 100%;
      text-align: center;
      color: #fff;
      box-shadow: 0 0 25px rgba(167, 124, 44, 0.5);
      animation: scaleIn 0.4s ease-in-out;
    }

    .subscribe-box img {
      width: 80px;
      margin-bottom: 15px;
      animation: float 3s ease-in-out infinite;
    }

    .subscribe-box h2 {
      font-size: 22px;
      margin: 5px 0 8px;
      font-weight: bold;
      letter-spacing: 1px;
      text-transform: uppercase;
      background: linear-gradient(90deg, #ffda8b, #c1974c);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .subscribe-box p {
      font-size: 14px;
      color: #ddd;
      margin-bottom: 20px;
    }

    /* Input + button inline */
    .form-group {
      display: flex;
      gap: 8px;
      width: 100%;
      margin-bottom: 18px;
    }

    .subscribe-box input[type="email"] {
      flex: 1;
      padding: 12px 14px;
      border-radius: 8px;
      border: 1px solid #a77c2c;
      background: rgba(42, 42, 42, 0.8);
      color: #fff;
      font-size: 15px;
      outline: none;
    }

    .subscribe-box input::placeholder {
      color: #bbb;
    }

    .subscribe-box button {
      padding: 12px 18px;
      border: none;
      border-radius: 8px;
      background: linear-gradient(135deg, #ffd27d, #c1974c);
      color: #111;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.3s;
    }

    .subscribe-box button:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 15px rgba(193, 151, 76, 0.5);
    }

    /* Close button */
    .close-btn {
      position: absolute;
      top: 12px;
      right: 16px;
      font-size: 24px;
      color: #fff;
      cursor: pointer;
      font-weight: bold;
      transition: transform 0.2s;
    }

    .close-btn:hover {
      transform: rotate(90deg);
      color: #ffd27d;
    }

    /* Animations */
    @keyframes fadeInBg {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @keyframes scaleIn {
      from { opacity: 0; transform: scale(0.9); }
      to { opacity: 1; transform: scale(1); }
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-6px); }
    }

    /* Responsive Design */
    @media (max-width: 768px) {
      .subscribe-box {
        max-width: 95%;
        padding: 22px 18px;
      }
      .form-group {
        flex-direction: column;
      }
      .subscribe-box button {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <!-- Popup Overlay -->
  <div class="popup-overlay" id="popup">
    <div class="subscribe-box">
      <span class="close-btn" onclick="closePopup()">&times;</span>
      <img src="./image/LOGO FOR Print 3.png" alt="Logo">
      <h2>Stay Updated</h2>
      <p>Join our newsletter & magazine updates 🚀</p>

      <div class="form-group">
        <input type="email" id="email" placeholder="Enter Your Email">
        <button onclick="subscribe()">Subscribe</button>
      </div>
      <small style="color:#aaa;">We respect your privacy. No spam ✨</small>
    </div>
  </div>

<script>
  // Show popup only once for the entire site visit (using localStorage)
  window.onload = function () {
    if (!localStorage.getItem("subscribedPopupShown")) {
      document.getElementById("popup").style.display = "flex";
      localStorage.setItem("subscribedPopupShown", "true");
    }
  };

  function closePopup() {
    document.getElementById("popup").style.display = "none";
  }

  function subscribe() {
    const email = document.getElementById('email').value;
    if (email.trim() === "") {
      alert("⚠️ Please enter your email.");
    } else {
      alert("✅ Thank you for subscribing, " + email + "!");
      closePopup();
    }
  }
</script>
</body>
</html>
