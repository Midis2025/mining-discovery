<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Header Dropdown Hover + Hamburger</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" />

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
    }

    /* HEADER BASE */
    .main-header {
      width: 100%;
      position: fixed;
      top: 0;
      left: 0;
      background: #fff;
      border-bottom: 1px solid #ddd;
      z-index: 1000;
    }

    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 20px;
    }

    .logo {
      height: 50px;
    }

    .nav-links {
      display: flex;
      gap: 25px;
      align-items: center;
    }

    .nav-links li {
      list-style: none;
      position: relative;
    }

    .nav-links a {
      text-decoration: none;
      color: #222;
      font-weight: 500;
      padding: 8px 5px;
      transition: color 0.3s ease;
    }

    .nav-links a:hover {
      color: #bfa27d;
    }

    /* DROPDOWN MENU (same design as hamburger dropdown) */
    .dropdown-menu {
      display: none;
      position: absolute;
      top: 100%;
      left: 0;
      background: #fff;
      width: 250px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
      border-radius: 10px;
      padding: 15px;
      animation: fadeIn 0.3s ease forwards;
    }

    .dropdown-menu .menu-row {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .dropdown-menu a {
      padding: 10px;
      border-radius: 8px;
      transition: background 0.3s;
    }

    .dropdown-menu a:hover {
      background: #f5f5f5;
    }

    @keyframes fadeIn {
      from {opacity: 0; transform: translateY(10px);}
      to {opacity: 1; transform: translateY(0);}
    }

    /* HAMBURGER MENU BUTTON */
    .hamburger {
      display: none;
      background: none;
      border: none;
      font-size: 24px;
      cursor: pointer;
    }

    /* HAMBURGER DROPDOWN DESIGN */
    .hamburger-menu {
      display: none;
      background: #fff;
      position: absolute;
      top: 70px;
      left: 0;
      width: 100%;
      box-shadow: 0 5px 15px rgba(0,0,0,0.1);
      padding: 20px;
      border-top: 2px solid #bfa27d;
    }

    .menu-row {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .menu-row a {
      text-decoration: none;
      color: #222;
      padding: 10px;
      border-radius: 8px;
    }

    .menu-row a:hover {
      background: #f5f5f5;
    }

    /* MOBILE */
    @media (max-width: 900px) {
      .hamburger {
        display: block;
      }

      .nav-links {
        display: none;
      }

      .hamburger-menu {
        display: none;
        position: static;
      }

      .mobile-active .hamburger-menu {
        display: block;
      }

      .dropdown-menu {
        display: none !important;
      }
    }
  </style>
</head>
<body>

  <header class="main-header">
    <div class="header-top">
      <div class="logo-social">
        <a href="#"><img src="./image/LOGO FOR Print.png" alt="Logo" class="logo"></a>
      </div>

      <button class="hamburger" onclick="toggleMenu2()">
        <i class="fas fa-bars"></i>
      </button>

      <ul class="nav-links">
        <li class="nav-item-with-dropdown" data-menu="newsMenu">
          <a href="#">News</a>
          <div class="dropdown-menu" id="newsMenu">
            <div class="menu-row">
              <a href="#">Latest News</a>
              <a href="#">Trending</a>
              <a href="#">Industry Updates</a>
              <a href="#">Press Releases</a>
            </div>
          </div>
        </li>

        <li class="nav-item-with-dropdown" data-menu="magazineMenu">
          <a href="#">Magazine</a>
          <div class="dropdown-menu" id="magazineMenu">
            <div class="menu-row">
              <a href="#">Monthly Issue</a>
              <a href="#">Weekly Highlights</a>
              <a href="#">Editorial Picks</a>
            </div>
          </div>
        </li>

        <li class="nav-item-with-dropdown" data-menu="serviceMenu">
          <a href="#">Services</a>
          <div class="dropdown-menu" id="serviceMenu">
            <div class="menu-row">
              <a href="#">Consulting</a>
              <a href="#">Marketing</a>
              <a href="#">Web Design</a>
            </div>
          </div>
        </li>
      </ul>
    </div>

    <!-- Hamburger 2 Menu (same design for mobile) -->
    <div class="hamburger-menu" id="hamburgerMenu">
      <div class="menu-row">
        <a href="#">Home</a>
        <a href="#">About</a>
        <a href="#">Magazine</a>
        <a href="#">Services</a>
        <a href="#">Contact</a>
      </div>
    </div>
  </header>

  <script>
    // ✅ Hamburger Toggle for Mobile
    function toggleMenu2() {
      const header = document.querySelector(".main-header");
      header.classList.toggle("mobile-active");
    }

    // ✅ Hover Dropdown Functionality for Desktop Only
    if (window.innerWidth >= 900) {
      const navItems = document.querySelectorAll(".nav-item-with-dropdown");

      navItems.forEach(item => {
        const menuId = item.getAttribute("data-menu");
        const dropdown = document.getElementById(menuId);

        item.addEventListener("mouseenter", () => {
          document.querySelectorAll(".dropdown-menu").forEach(menu => {
            menu.style.display = "none";
          });
          dropdown.style.display = "block";
        });

        item.addEventListener("mouseleave", () => {
          dropdown.style.display = "none";
        });
      });
    }
  </script>

</body>
</html>
