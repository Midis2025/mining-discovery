<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Google Account Popup Clone</title>
  <style>
    body {
      background: rgba(0,0,0,0.3);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      font-family: "Google Sans", Arial, sans-serif;
    }
    .popup {
      background: #fff;
      border-radius: 10px;
      width: 400px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.2);
      overflow: hidden;
      animation: fadeIn 0.3s ease;
    }
    .header {
      display: flex;
      align-items: center;
      padding: 15px;
      border-bottom: 1px solid #ddd;
    }
    .header img {
      width: 25px;
      margin-right: 10px;
    }
    .header span {
      font-size: 16px;
      color: #333;
    }
    .account {
      display: flex;
      align-items: center;
      padding: 12px 20px;
      cursor: pointer;
    }
    .account:hover {
      background: #f7f7f7;
    }
    .account img {
      width: 35px;
      height: 35px;
      border-radius: 50%;
      margin-right: 15px;
    }
    .account-info h4 {
      margin: 0;
      font-weight: 500;
      color: #202124;
    }
    .account-info p {
      margin: 0;
      color: #5f6368;
      font-size: 14px;
    }
    @keyframes fadeIn {
      from {opacity: 0; transform: scale(0.95);}
      to {opacity: 1; transform: scale(1);}
    }
  </style>
</head>
<body>
  <div class="popup">
    <div class="header">
      <img src="https://www.gstatic.com/images/branding/product/1x/googleg_32dp.png">
      <span>Sign in to indiatimes.com with google.com</span>
    </div>

    <div class="account" onclick="alert('Login with dixitshivi130@gmail.com')">
      <img src="https://lh3.googleusercontent.com/a/default-user">
      <div class="account-info">
        <h4>Shivani Dixit</h4>
        <p>dixitshivi130@gmail.com</p>
      </div>
    </div>

    <div class="account" onclick="alert('Login with shivanidixit133@gmail.com')">
      <img src="https://lh3.googleusercontent.com/a/default-user">
      <div class="account-info">
        <h4>Shivani Dixit</h4>
        <p>shivanidixit133@gmail.com</p>
      </div>
    </div>
  </div>
</body>
</html>
