<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Video Popup</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      background-color: #f4f4f4;
    }

    .container {
      text-align: center;
      background: #fff;
      padding: 40px 20px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    }

    h1 {
      margin-bottom: 30px;
      color: #333;
    }

    .video-button {
      display: inline-block;
      padding: 12px 30px;
      font-size: 18px;
      font-weight: bold;
      color: #fff;
      background-color: #ff0000;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      text-decoration: none;
      transition: background 0.3s ease;
    }

    .video-button:hover {
      background-color: #cc0000;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Watch Our Video</h1>
    <button class="video-button" id="openVideo">Open Video</button>
    <p>The video will open in a new popup window because embedding is restricted.</p>
  </div>

  <script>
    const button = document.getElementById("openVideo");

    button.addEventListener("click", function() {
      window.open(
        "https://www.youtube.com/watch?v=sxSiWgn8YPI",
        "VideoPopup",
        "width=800,height=500,top=100,left=100,resizable=yes,scrollbars=yes"
      );
    });
  </script>
</body>
</html>
