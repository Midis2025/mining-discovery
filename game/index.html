<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Pacman Game</title>
   <!-- Canonical (recommended) -->
  <link rel="canonical" href="https://www.miningdiscovery.com/">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="https://www.miningdiscovery.com/image/Ceos%20cover/Ceos%20cover/mD%20new%20logo%204%20%283%29%20%281%29.png">

  
  <!-- ✅ Open Graph (For Facebook, LinkedIn, WhatsApp, etc.) -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Mining Discovery" />
  <meta property="og:title" content="Mining Discovery - Explore the World of Mining" />
  <meta property="og:description" content="Mining Discovery brings you the latest mining news, discoveries, and industry trends from around the world." />
  <meta property="og:url" content="https://www.miningdiscovery.com/" />
  <meta property="og:image" content="https://www.miningdiscovery.com/image/logo.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />

  <!-- ✅ Twitter Card -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Mining Discovery - Explore the World of Mining" />
  <meta name="twitter:description" content="Stay updated with the latest in mining, technology, and innovation." />
  <meta name="twitter:image" content="https://www.miningdiscovery.com/image/logo.png" />

  <!-- Apple Touch Icon -->
  <link rel="apple-touch-icon" sizes="180x180" href="https://www.miningdiscovery.com/image/logo.png" />

  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="game-container">
    <div class="header">
      <h1 class="title">PACMAN</h1>
       </div>

    <div class="stats-container">
      <div class="stat-card">
        <div class="stat-label">Score</div>
        <div class="stat-value" id="score">0</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Level</div>
        <div class="stat-value level" id="level">1</div>
      </div>
      <div class="stat-card" id="status-card" style="display: none;">
        <div class="stat-label">Status</div>
        <div class="stat-value" id="status"></div>
      </div>
    </div>

    <div class="game-board-container">
      <div id="game-board" class="game-board"></div>
    </div>

    <div class="mobile-controls">
      <button class="control-btn up" data-dir="up">▲</button>
      <div class="middle-row">
        <button class="control-btn left" data-dir="left">◀</button>
        <button class="control-btn down" data-dir="down">▼</button>
        <button class="control-btn right" data-dir="right">▶</button>
      </div>
    </div>

    <div class="restart-container" id="restart-container" style="display: none;">
      <button id="restart-btn" class="restart-button">Play Again</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
