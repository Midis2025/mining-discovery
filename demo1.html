<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CEO’s Profiles</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Poppins", sans-serif;
    }

    body {
      background-color: #fff;
      padding: 40px 0;
    }

    .section-container {
      width: 90%;
      max-width: 1300px;
      margin: auto;
    }

    .section-title {
      font-size: 26px;
      font-weight: 600;
      color: #111;
    }

    .underline {
      width: 80px;
      height: 3px;
      background: #c1973d;
      margin-top: 8px;
      margin-bottom: 35px;
    }

    /* Carousel layout */
    .carousel-wrapper {
      position: relative;
      overflow: hidden;
    }

    .carousel-track {
      display: flex;
      transition: transform 0.5s ease-in-out;
    }

    .profile-card {
      background: #000;
      flex: 0 0 15.8%;
      margin-right: 20px;
      border-radius: 8px;
      color: #fff;
      text-align: center;
      border: 1px solid #333;
      overflow: hidden;
      height: 267px;
    }

    .profile-card img {
      width: 100%;
      height: 270px;
      object-fit: cover;
      border-bottom: 1px solid #333;
    }

    .profile-card h3 {
      font-size: 16px;
      font-weight: 600;
      margin-top: 10px;
      color: #f7c552;
      text-transform: uppercase;
    }

    .profile-card p {
      font-size: 13px;
      color: #ddd;
    }

    /* Pagination */
    .pagination {
      margin-top: 25px;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
    }

    .pagination button {
      border: 1px solid #ccc;
      background: none;
      color: #333;
      padding: 6px 11px;
      border-radius: 50%;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .pagination button.active,
    .pagination button:hover {
      background: #c1973d;
      color: #fff;
      border-color: #c1973d;
    }

    .pagination i {
      font-size: 12px;
    }

    @media (max-width: 1024px) {
      .profile-card {
        flex: 0 0 31%;
      }
    }

    @media (max-width: 768px) {
      .profile-card {
        flex: 0 0 48%;
      }
    }

    @media (max-width: 480px) {
      .profile-card {
        flex: 0 0 100%;
      }
    }
  </style>
</head>
<body>
  <div class="section-container">
    <h2 class="section-title">CEO’s Profiles</h2>
    <div class="underline"></div>

    <div class="carousel-wrapper">
      <div class="carousel-track" id="carouselTrack">
        <!-- 6 visible cards -->
        <div class="profile-card">
          <img src="./image/Ceos cover/Ceos cover/Brian Miller Astra Exploration.png" alt="">
         
        </div>
        <div class="profile-card">
          <img src="./image/Ceos cover/Ceos cover/Copy of Zayn Kalyan Scorpio Gold Corp.png" alt="">
        
        </div>
        <div class="profile-card">
          <img src="./image/Ceos cover/Ceos cover/George Bee Us Gold.png" alt="">
       
        </div>
        <div class="profile-card">
          <img src="./image/Ceos cover/Ceos cover/Guanjuato Gold Ceo Profile.png" alt="">

        </div>
        <div class="profile-card">
          <img src="./image/Ceos cover/Ceos cover/Mati Talika Aurion Resources.png" alt="">
       
        </div>
        <div class="profile-card">
          <img src="./image/Ceos cover/Ceos cover/Michel Amar Digipower X.png" alt="">
    
        </div>

        <!-- Extra hidden slides for pagination demo -->
        <div class="profile-card">
          <img src="./image/Ceos cover/Ceos cover/Mike Stark Arizona.png" alt="">
        
        </div>
        <div class="profile-card">
          <img src="./image/Ceos cover/Ceos cover/Paul Cowley Phenom Resources.png" alt="">
    
        </div>
        <div class="profile-card">
          <img src="./image/Ceos cover/Ceos cover/George Bee Us Gold.png" alt="">
         
        </div>
        <div class="profile-card">
          <img src="https://via.placeholder.com/250x300?text=Emma+Stone" alt="">
         
        </div>
        <div class="profile-card">
          <img src="https://via.placeholder.com/250x300?text=Chris+Brown" alt="">
         
        </div>
        <div class="profile-card">
          <img src="https://via.placeholder.com/250x300?text=Sarah+Lee" alt="">
      
        </div>
      </div>
    </div>

    <div class="pagination">
      <button id="prev"><i class="fa fa-angle-double-left"></i></button>
      <button class="page-btn active" data-index="0">1</button>
      <button class="page-btn" data-index="1">2</button>
      <!-- <button class="page-btn" data-index="2">3</button> -->
      <button id="next"><i class="fa fa-angle-double-right"></i></button>
    </div>
  </div>

  <script>
    const track = document.getElementById('carouselTrack');
    const pageButtons = document.querySelectorAll('.page-btn');
    let currentIndex = 0;

    function updateCarousel(index) {
      const cardWidth = document.querySelector('.profile-card').offsetWidth + 20;
      const moveX = cardWidth * 6 * index;
      track.style.transform = `translateX(-${moveX}px)`;
      pageButtons.forEach(btn => btn.classList.remove('active'));
      pageButtons[index].classList.add('active');
    }

    document.getElementById('prev').addEventListener('click', () => {
      if (currentIndex > 0) {
        currentIndex--;
        updateCarousel(currentIndex);
      }
    });

    document.getElementById('next').addEventListener('click', () => {
      if (currentIndex < pageButtons.length - 1) {
        currentIndex++;
        updateCarousel(currentIndex);
      }
    });

    pageButtons.forEach(btn => {
      btn.addEventListener('click', () => {
        currentIndex = parseInt(btn.dataset.index);
        updateCarousel(currentIndex);
      });
    });
  </script>
</body>
</html>
